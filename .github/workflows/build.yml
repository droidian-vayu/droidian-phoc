name: Build droidian-phoc package

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create output directory
        run: mkdir -p buildd-results

      - name: Build package
        run: |
          docker pull quay.io/droidian/build-essential:current-arm64

          docker run --rm \
            -e CI \
            -e IS_CONTAINER=true \
            -e CIRCLECI=true \
            -e CIRCLE_BRANCH="${{ github.ref_name }}" \
            -e CIRCLE_SHA1="${{ github.sha }}" \
            -e CIRCLE_TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}" \
            -e RELENG_HOST_ARCH=arm64 \
            -v "${{ github.workspace }}:/buildd/sources" \
            -v "${{ github.workspace }}/buildd-results:/buildd" \
            quay.io/droidian/build-essential:current-arm64 \
            /bin/bash -lc '
              cd /buildd/sources
              git config --global --add safe.directory /buildd/sources
              echo "=== BEFORE BUILD ==="
              git describe --tags --always || true
              git tag -l 'upstream/*' || true
              git rev-parse upstream/0.47.0 || true
              echo "=== TOOLCHAIN ==="    
              set -x
              which aarch64-linux-gnu-gcc
              echo "which exit=$?"
              dpkg -l | grep gcc-aarch64
              echo "dpkg exit=$?"
              find /usr/bin -name '*aarch64*'
              find /usr/bin -name '*gcc*' | grep aarch64
              env | grep RELENG
              set +x
              echo "=== BUILD ==="
              apt-cache policy gcc-aarch64-linux-gnu
              dpkg -l | grep aarch64
              ls /usr/bin/aarch64-linux-gnu-*
              releng-build-package
            '
            
      - name: Show generated files
        run: ls -lah buildd-results  
        
      - name: Delete latest release
        run: |
          gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Latest droidian-phoc build"
          files: /tmp/results/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
